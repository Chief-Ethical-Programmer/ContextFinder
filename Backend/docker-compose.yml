services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: contextfinder
      POSTGRES_PASSWORD: contextfinder
      POSTGRES_DB: contextfinder
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextfinder -d contextfinder"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - contextfinder_pgdata:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://contextfinder:contextfinder@postgres:5432/contextfinder
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  contextfinder_pgdata:

  
